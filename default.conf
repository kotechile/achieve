server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Dated WordPress URLs -> flat slug (the CMS emits /YYYY/MM/DD/slug/)
    location ~* '^/\d{4}/\d{2}/\d{2}/([^/]+)/?$' {
        return 301 /$1/;
    }

    # 2. Moved tool paths.
    #    These shipped as /calculators/<slug>/ on giniloh.com. They live under /tools/ here.
    #    Astro also emits static redirect pages for the same paths; handling them at the edge
    #    avoids putting a redirect round-trip through the origin.
    location ~* '^/calculators/?$' {
        return 301 /tools/;
    }
    location ~* '^/calculators/gpu-compute/?$' {
        return 301 /tools/gpu-compute/;
    }
    location ~* '^/calculators/decision-intelligence/?$' {
        return 301 /tools/master-asset-tco/;
    }

    # 3. Legacy giniloh names for the app directory.
    #    /apps/ IS a real route on this site (the PRO app directory) and must never be
    #    redirected — only the old aliases collapse into it. giniloh's config redirects
    #    ^/(apps|showcase|pro-apps)/?$ off-site, which would have 301'd this site's own nav
    #    link to the other property.
    location ~* '^/(showcase|pro-apps)/?$' {
        return 301 /apps/;
    }

    # 4. Cache hashed static assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Static routes. Astro emits directory-style output, so try the exact path, then the
    #    directory, then the .html file.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 6. 404 handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# ─────────────────────────────────────────────────────────────────────────────────────────
# REMOVED: the WordPress backend/media proxy.
#
# This block shipped in the container's first deploy and was the cause of a 502 Bad Gateway.
#
#     location ~* '^/(wp-content|wp-includes|wp-json|wp-admin|...)'
#     { proxy_pass https://cms.giniloh.com; ... }
#
# A LITERAL hostname in `proxy_pass` is resolved when nginx loads its configuration, i.e. at
# container boot. If that DNS lookup fails, nginx aborts before it ever serves a request:
#
#     [emerg] host not found in upstream "cms.giniloh.com" in /etc/nginx/conf.d/default.conf:46
#
# The container exits, the reverse proxy has no backend, and every request gets a 502. Verified
# by running the image with an unreachable resolver.
#
# It was also unnecessary: the built site contains ZERO same-origin /wp-content or /wp-includes
# references, because lib/wordpress.ts leaves uploaded media on absolute CMS URLs (537 of them).
# Every image, stylesheet and script resolves straight to the CMS or to this origin.
#
# If same-origin proxying is ever wanted, do NOT reintroduce a literal hostname. Resolve at
# request time instead, so a DNS hiccup degrades one request rather than the whole container:
#
#     resolver 127.0.0.11 valid=30s ipv6=off;   # Docker's embedded DNS
#     set $wp_upstream https://cms.giniloh.com;
#     location ~* '^/(wp-content|wp-includes|wp-json)') {
#         proxy_pass $wp_upstream$request_uri;
#         proxy_ssl_name cms.giniloh.com;
#         proxy_ssl_server_name on;
#     }
# ─────────────────────────────────────────────────────────────────────────────────────────
