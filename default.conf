server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Dated WordPress URLs -> flat slug (the CMS emits /YYYY/MM/DD/slug/)
    location ~* '^/\d{4}/\d{2}/\d{2}/([^/]+)/?$' {
        return 301 /$1/;
    }

    # 2. Moved tool paths.
    #    These shipped as /calculators/<slug>/ on giniloh.com. They live under /tools/ here.
    #    Astro emits static redirect pages for the same paths, but handling them at the edge
    #    avoids putting a redirect round-trip through the origin.
    location ~* '^/calculators/?$' {
        return 301 /tools/;
    }
    location ~* '^/calculators/gpu-compute/?$' {
        return 301 /tools/gpu-compute/;
    }
    location ~* '^/calculators/decision-intelligence/?$' {
        return 301 /tools/master-asset-tco/;
    }

    # 3. Legacy giniloh names for the app directory.
    #    /apps/ IS a real route on this site (the PRO app directory) and must never be
    #    redirected — only the old aliases collapse into it. giniloh's config redirects
    #    ^/(apps|showcase|pro-apps)/?$ off-site, which would have 301'd this site's own nav
    #    link to the other property.
    location ~* '^/(showcase|pro-apps)/?$' {
        return 301 /apps/;
    }

    # 4. Cache hashed static assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. Proxy the WordPress backend and media.
    #    Both properties read the same CMS, so uploaded media referenced inside article HTML
    #    resolves through this site's own domain instead of leaking the CMS hostname into
    #    page source.
    location ~* '^/(wp-content|wp-includes|wp-json|wp-admin|wp-login\.php|wp-cron\.php)' {
        proxy_pass https://cms.giniloh.com;
        proxy_set_header Host cms.giniloh.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 6. Static routes. Astro emits directory-style output, so try the exact path, then the
    #    directory, then the .html file.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 7. 404 handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
