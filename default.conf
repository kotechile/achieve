server {
    listen 80;
    # Explicit rather than `localhost`: this is the only server block so it acts as nginx's
    # default anyway, but naming the real hosts documents intent and keeps routing correct if a
    # second block is ever added. `_` preserves the catch-all for Traefik's health probes, which
    # arrive with no meaningful Host header.
    server_name aichieve.net www.aichieve.net localhost _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Dated WordPress URLs -> flat slug (the CMS emits /YYYY/MM/DD/slug/)
    location ~* '^/\d{4}/\d{2}/\d{2}/([^/]+)/?$' {
        return 301 /$1/;
    }

    # 2. Moved tool paths.
    #    These shipped as /calculators/<slug>/ on giniloh.com. They live under /tools/ here.
    #    Astro emits static redirect pages for the same paths, but handling them at the edge
    #    avoids putting a redirect round-trip through the origin.
    location ~* '^/calculators/?$' {
        return 301 /tools/;
    }
    location ~* '^/calculators/gpu-compute/?$' {
        return 301 /tools/gpu-compute/;
    }
    location ~* '^/calculators/decision-intelligence/?$' {
        return 301 /tools/master-asset-tco/;
    }

    # 3. Legacy giniloh names for the app directory.
    #    /apps/ IS a real route on this site (the PRO app directory) and must never be
    #    redirected — only the old aliases collapse into it. giniloh's config redirects
    #    ^/(apps|showcase|pro-apps)/?$ off-site, which would have 301'd this site's own nav
    #    link to the other property.
    location ~* '^/(showcase|pro-apps)/?$' {
        return 301 /apps/;
    }

    # 4. Cache hashed static assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. NO WordPress proxy here — deliberately.
    #
    #    giniloh.com proxies /wp-content|/wp-json|... to cms.giniloh.com. That block was NOT
    #    copied, because it is (a) unnecessary and (b) an outage risk:
    #
    #    (a) This site emits ZERO same-origin WP paths. Every one of the 537 CMS references in
    #        the built output is already absolute (https://cms.giniloh.com/...), because
    #        lib/wordpress.ts keeps upload URLs absolute by design. Nothing routes through here.
    #
    #    (b) A literal `proxy_pass https://cms.giniloh.com;` is resolved by nginx at CONFIG LOAD
    #        TIME, i.e. container boot. If DNS is not ready at that moment the whole server
    #        refuses to start:
    #            [emerg] host not found in upstream "cms.giniloh.com" in default.conf:46
    #        The container exits, Traefik has no backend, and the site returns 502 Bad Gateway.
    #        Reproduced locally with `docker run --dns 127.0.0.1 <image> nginx -t`.
    #
    #    If same-origin WP paths are ever needed, add the block back using RUNTIME resolution so
    #    a DNS blip cannot prevent boot:
    #
    #        resolver 127.0.0.11 valid=30s ipv6=off;   # Docker embedded DNS
    #        set $wp https://cms.giniloh.com;
    #        proxy_pass $wp$request_uri;               # variable => resolved per request
    #        proxy_ssl_server_name on;                 # required for SNI on an https upstream

    # 6. Static routes. Astro emits directory-style output, so try the exact path, then the
    #    directory, then the .html file.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 7. 404 handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
